name: Build and Sign Release APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generate Keystore
      run: |
        keytool -genkeypair -alias mykeyalias -keypass 12345678 -keystore release.keystore -storepass 12345678 -dname "CN=App, OU=Dev, O=App, L=City, ST=State, C=IR" -validity 10000 -keyalg RSA -keysize 2048

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Sign APK
      run: |
        $ANDROID_HOME/build-tools/33.0.1/apksigner sign --ks release.keystore --ks-pass pass:12345678 --ks-key-alias mykeyalias --key-pass pass:12345678 --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AmarMasrafInternet-Signed-APK
        path: app/build/outputs/apk/release/app-release-signed.apk
