plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.amarmasraf.internet'
    compileSdk 34

    defaultConfig {
        applicationId "com.amarmasraf.internet"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def tapsellAppKey = (project.findProperty("TAPSELL_APP_KEY") ?: System.getenv("TAPSELL_APP_KEY") ?: "aanbcpksderreqsnknjnookaelpsgibjbrjbcfsicndoqmkimibmncsnfqrrbkccaiqnjb").toString().replace("\\", "\\\\").replace("\"", "\\\"")
        def adiveryAppKey = (project.findProperty("ADIVERY_APP_KEY") ?: System.getenv("ADIVERY_APP_KEY") ?: "c92f0ab7-8f64-4007-a345-58129edfa87b").toString().replace("\\", "\\\\").replace("\"", "\\\"")
        buildConfigField "String", "TAPSELL_APP_KEY", "\"${tapsellAppKey}\""
        buildConfigField "String", "ADIVERY_APP_KEY", "\"${adiveryAppKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    // کتابخانه تپسل پلاس
    implementation 'ir.tapsell.plus:tapsell-plus-sdk-android:2.3.3'
    implementation 'com.adivery:sdk:4.10.0-alpha.1'
}
